<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playable Ad</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #00bfdf;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            color: #fff;
            font: 16px/1.4 sans-serif;
            background: #000;
        }

        #splash::before {
            width: 32px;
            height: 32px;
            content: "";
            border: 3px solid rgb(255 255 255 / 25%);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #splash.is-ready {
            cursor: pointer;
            background: rgb(0 0 0 / 55%);
        }

        #splash.is-ready::before {
            display: none;
        }

        .tap-prompt {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
        }

        #splash.is-ready .tap-prompt {
            display: flex;
        }

        .tap-prompt svg {
            width: 88px;
            height: 88px;
            overflow: visible;
            animation: pointer-bob 1.8s ease-in-out infinite;
        }

        .health-bar {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: 50%;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(300px, calc(100% - 32px));
            height: 50px;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .health-bar__icon {
            flex: 0 0 50px;
            width: 50px;
            height: 50px;
            color: #95c11f;
            transition: color 0.3s linear;
        }

        .health-bar__fuel-bar-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .health-bar__fuel-bar {
            width: 100%;
            height: 50%;
            background: #95c11f;
            transition: width 0.3s linear, background-color 0.3s linear;
        }

        .time-progress {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: 50%;
            z-index: 2;
            display: flex;
            align-items: center;
            width: 240px;
            height: 50px;
            transform: translateX(-50%);
            pointer-events: none;
            box-sizing: border-box;
        }

        .time-progress__track {
            width: 100%;
            height: 18px;
            padding: 3px;
            overflow: hidden;
            border: 2px solid rgb(255 255 255 / 15%);
            border-radius: 6px;
            background: rgb(18 18 24 / 85%);
            box-shadow: 0 8px 32px rgb(0 0 0 / 50%);
            box-sizing: border-box;
        }

        .time-progress__value {
            width: 100%;
            height: 100%;
            background: #d99b47;
            border-radius: 2px;
            transform-origin: right center;
            transition: transform 100ms linear;
            will-change: transform;
        }

        .time-progress__fire {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 50px;
            height: 50px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: left 100ms linear;
            will-change: left;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pointer-bob {
            0%, 100% { transform: translateY(-8px); }
            50% { transform: translateY(8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .tap-prompt svg { animation: none; }
        }
    </style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading">
    <div class="tap-prompt" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.38.72V3.53l-.09.17A16.93,16.93,0,0,0,4.5,11.28h0a1.89,1.89,0,0,0,1.61,1.86l5,.7v6.57a1.89,1.89,0,0,0,2,1.86,1.94,1.94,0,0,0,1.71-2V10.09l1.3,1.3a2,2,0,0,0,1.4.58,2,2,0,0,0,1.41-.58,2,2,0,0,0,0-2.81l-5-5.05V.72"
                  fill="none" stroke="currentColor" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Tap to move</span>
    </div>
</div>
<div id="time-progress" class="time-progress" role="progressbar" aria-label="Remaining time" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
    <div class="time-progress__track">
        <div class="time-progress__value"></div>
    </div>
    <svg class="time-progress__fire" viewBox="-33 0 255 255" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid" aria-hidden="true">
        <defs>
            <style>
                .cls-3 {
                    fill: url(#linear-gradient-1);
                }
                .cls-4 {
                    fill: #fc9502;
                }
                .cls-5 {
                    fill: #fce202;
                }
            </style>
            <linearGradient id="linear-gradient-1" gradientUnits="userSpaceOnUse" x1="94.141" y1="255" x2="94.141" y2="0.188">
                <stop offset="0" stop-color="#ff4c0d"/>
                <stop offset="1" stop-color="#fc9502"/>
            </linearGradient>
        </defs>
        <g id="fire">
            <path d="M187.899,164.809 C185.803,214.868 144.574,254.812 94.000,254.812 C42.085,254.812 -0.000,211.312 -0.000,160.812 C-0.000,154.062 -0.121,140.572 10.000,117.812 C16.057,104.191 19.856,95.634 22.000,87.812 C23.178,83.513 25.469,76.683 32.000,87.812 C35.851,94.374 36.000,103.812 36.000,103.812 C36.000,103.812 50.328,92.817 60.000,71.812 C74.179,41.019 62.866,22.612 59.000,9.812 C57.662,5.384 56.822,-2.574 66.000,0.812 C75.352,4.263 100.076,21.570 113.000,39.812 C131.445,65.847 138.000,90.812 138.000,90.812 C138.000,90.812 143.906,83.482 146.000,75.812 C148.365,67.151 148.400,58.573 155.999,67.813 C163.226,76.600 173.959,93.113 180.000,108.812 C190.969,137.321 187.899,164.809 187.899,164.809 Z" id="path-1" class="cls-3" fill-rule="evenodd"/>
            <path d="M94.000,254.812 C58.101,254.812 29.000,225.711 29.000,189.812 C29.000,168.151 37.729,155.000 55.896,137.166 C67.528,125.747 78.415,111.722 83.042,102.172 C83.953,100.292 86.026,90.495 94.019,101.966 C98.212,107.982 104.785,118.681 109.000,127.812 C116.266,143.555 118.000,158.812 118.000,158.812 C118.000,158.812 125.121,154.616 130.000,143.812 C131.573,140.330 134.753,127.148 143.643,140.328 C150.166,150.000 159.127,167.390 159.000,189.812 C159.000,225.711 129.898,254.812 94.000,254.812 Z" id="path-2" class="cls-4" fill-rule="evenodd"/>
            <path d="M95.000,183.812 C104.250,183.812 104.250,200.941 116.000,223.812 C123.824,239.041 112.121,254.812 95.000,254.812 C77.879,254.812 69.000,240.933 69.000,223.812 C69.000,206.692 85.750,183.812 95.000,183.812 Z" id="path-3" class="cls-5" fill-rule="evenodd"/>
        </g>
    </svg>
</div>
<div id="game"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
